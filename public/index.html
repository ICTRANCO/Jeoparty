<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jeoparty Board</title>
<link rel="stylesheet" href="styles.css?v=19" />
</head>
<body class="board-page">
<div class="topbar">
  <h1 id="game-title">JEOPARTY!</h1>
  <div class="round-name" aria-live="polite">
    <span class="round-name-kicker" id="round-name-kicker">Round 1</span>
    <span class="round-name-title" id="round-name-title">Jeopardy!</span>
  </div>
  <div class="topbar-actions">
    <div class="buzzer-hud">
      <div class="buzzer-hint">Host starts the round</div>
      <div class="buzzer-status" id="buzzer-status">reading question</div>
    </div>
    <button class="btn-link" id="reset-btn">New Game</button>
    <a href="home.html">Main Screen</a>
    <a href="host.html" target="_blank" rel="noopener">Host View</a>
    <a href="admin.html">Admin</a>
  </div>
</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
  <section class="final-jeopardy hidden" id="final-jeopardy" aria-live="polite">
    <div class="final-jeopardy-label">Final Jeopardy</div>
    <h2 id="final-jeopardy-category"></h2>
    <p id="final-jeopardy-clue"></p>
    <div class="final-jeopardy-answer hidden" id="final-jeopardy-answer"></div>
    <button class="btn-link hidden" id="final-jeopardy-reveal" type="button">Reveal Answer</button>
  </section>
</div>

<div class="scoreboard" id="scoreboard"></div>
<div class="status-msg" id="sheet-play-status" role="status" aria-live="polite" hidden></div>

<div class="overlay hidden" id="overlay">
  <div class="question-timer" id="question-timer-bar" aria-hidden="true"><div class="question-timer-fill" id="question-timer-fill"></div></div>
  <button class="question-back-btn" id="question-back-btn" type="button" aria-label="Return to the main board" title="Return to main board">←</button>
  <div class="review-badge hidden" id="review-badge">Reviewing a previously answered question</div>
  <div class="flip-stage">
    <div class="flip-card" id="flip-card">
      <div class="flip-face flip-front" id="flip-front"></div>
      <div class="flip-face flip-back">
        <div class="buzzer-overlay" id="buzzer-overlay">Waiting for a buzz</div>
        <div class="clue-text" id="clue-text"></div>
        <div class="answer-text" id="answer-text"></div>
        <div class="team-buzz-chips" id="team-buzz-chips"></div>
      </div>
    </div>
  </div>
  <div class="overlay-controls" id="overlay-controls" aria-hidden="true">
    <div class="overlay-controls-main">
      <button id="reveal-answer-btn">Reveal Answer</button>
      <button class="secondary" id="close-btn">Close</button>
    </div>
    <div class="scoring-controls" id="scoring-controls"></div>
  </div>
</div>

<script src="theme-music.js?v=1"></script>
<script src="game.js?v=24"></script>
</body>
</html>
